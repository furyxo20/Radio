*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.hero{text-align:center;padding-top:22px}

.ic{width:46px;height:46px;border-radius:50%;padding:0;font-size:1.15rem}.ic.on{background:var(--ac);color:#1a1200;border-color:var(--ac)}
.pp{width:78px;height:78px;border-radius:50%;border:0;font-size:1.9rem;color:#1a1200;background:var(--ac);padding:0}

.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 0}
label{display:block;font-size:.85rem;color:var(--mut);margin-top:12px}label.ck{display:flex;align-items:center;gap:8px}
input,textarea{width:100%;margin-top:5px;padding:10px;font:inherit;color:var(--tx);background:rgba(0,0,0,.25);border:1px solid var(--bd);border-radius:12px}

.pane{display:none}.pane.a{display:block;animation:in .35s ease both}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.it{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:.9rem}.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it button{padding:4px 10px}
.it.on span{color:var(--ac);font-weight:700}.it select{font:inherit;background:#222;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:3px;max-width:86px}

#disp .b1{font-size:9vw;font-weight:700;line-height:1.1}#dof{font-size:6vw;min-height:14vh;transition:opacity .6s}

.na *,.na .bgf i{animation:none!important}.it{content-visibility:auto;contain-intrinsic-size:auto 44px;transition:background .25s}.it:hover{background:rgba(255,255,255,.05)}.np.sw{animation:swap .55s cubic-bezier(.2,.8,.2,1)}@keyframes swap{from{opacity:0;transform:translateY(10px)}}.vz{display:flex;gap:4px;justify-content:center;align-items:flex-end;height:30px;margin:-6px 0 10px}.vz i{width:4px;height:100%;border-radius:3px;background:var(--ac);opacity:.85;transform:scaleY(.12);transform-origin:bottom;animation:vz 1s ease-in-out infinite alternate paused}.vz.play i{animation-play-state:running}@keyframes vz{to{transform:scaleY(1)}}.it.over{background:rgba(255,176,46,.22)}.it.drag{opacity:.45}.hd{cursor:grab;touch-action:none;color:var(--mut);padding:0 4px;user-select:none;flex:none}#t2{cursor:pointer;min-width:44px;text-align:right}#t1{min-width:44px}

 songN++;lg('song',f.name);setNP();hl();jP=S.nmOn&&S.jn>0&&songN%S.jn===0&&F.nm.some(f=>!f.off&&inW(f.win,true))}
async function advance(how){const back=how==='back';if(adv)return;adv=true;if(!how)try{await interlude()}catch(e){busy=false}adv=false;if(!running)return;
 let id;if(back){id=hist.pop();if(id==null)id=cur}else{if(cur!=null)hist.push(cur);if(hist.length>60)hist.shift();id=pick()}
 if(id==null){stop();toast('Queue එක ඉවරයි');return}playSong(id)}

la.ontimeupdate=()=>{const d=la.duration;if(!isFinite(d))return;if(jP&&la.currentTime>=Math.max(0,S.jd-1)&&!busy&&!paused){jP=false;jingle()}if(!seeking)$('seek').value=la.currentTime/d*1000;$('t1').textContent=mmss(la.currentTime);$('t2').textContent=S.rem?'-'+mmss(d-la.currentTime):mmss(d);$('t2').style.color=d-la.currentTime<10?'var(--ac)':''};
let seeking=false;$('t2').onclick=()=>{S.rem=!S.rem;$('s_rem').checked=S.rem;sv()};$('seek').oninput=()=>{seeking=true;if(isFinite(la.duration))la.currentTime=$('seek').value/1000*la.duration};$('seek').onchange=()=>seeking=false;
async function interlude(){sc++;if(!(S.sjOn&&sc>=Math.max(1,S.sn)))return;let L=F.sj.filter(f=>!f.off&&inW(f.win,true));if(!L.length)return;L=S.sjAll?L.sort(natural):[rnd('sj')];sc=0;busy=true;stTxt='🎼 ශොප් සිංදුව';ui();
 for(const f of L){if(!running)break;try{await ready(f.url);lg('sj',f.name);await playEl(adEl,f.url,S.sjv/100)}catch(e){toast('⚠️ '+e.message)}}busy=false;ui()}
async function interludeNow(f){if(busy||!running||paused)return;busy=true;stTxt='🎼 ශොප් සිංදුව';ui();adD=S.dv/100;
 try{await ready(f.url);await sleep(1200);lg('sj',f.name);await playEl(adEl,f.url,S.sjv/100)}catch(e){toast('⚠️ '+e.message)}adD=1;await sleep(900);busy=false;fin()}

async function doBreak(wt,fa){if(busy||!running||paused)return;const ad=fa||(S.adOn?rnd('ad'):null),tc=wt&&S.tm?timeClip():null;
 if(!ad&&!tc){adLeft=ivNow()*60000;toast('⚠️ ඇඩ් voice එකක් දාලා නෑ');return}

 try{if(ad)await ready(ad.url);if(tc)await ready(tc.url);if(ad)lg('ad',ad.name);if(tc)lg('time',tc.name);
  adD=S.dv/100;await sleep(1500);

 }catch(e){bgT=0;bgEl.pause();toast('⚠️ ඇඩ් එක ප්ලේ වුණේ නෑ: '+e.message)}
 adD=1;adLeft=ivNow()*60000;await sleep(1200);busy=false;fin()}

/* ---------- mic auto-volume ---------- */
let mc=null,an=null,ms=null,lvl=0,loud=0,quiet=0,calS=null;const buf=new Uint8Array(1024);
async function micOn(){if(an)return;try{ms=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false}});mc=new AudioContext();an=mc.createAnalyser();an.fftSize=1024;mc.createMediaStreamSource(ms).connect(an);$('micb').textContent='🎙 නවත්තන්න';$('micb').classList.add('on')}catch(e){S.auto=false;sv();$('s_auto').checked=false;upd();toast('❌ mic එකට අවසර නෑ (browser එකේ Allow කරන්න)')}}
function micOff(){try{ms&&ms.getTracks().forEach(t=>t.stop());mc&&mc.close()}catch(e){}an=ms=mc=null;micD=1;lvl=0;$('meter').style.transform='scaleX(0)';$('micb').textContent='🎙 ක්‍රියාත්මක කරන්න';$('micb').classList.remove('on');$('micst').textContent='';$('glow').style.transform='';$('glow').style.opacity=''}
function setAuto(v){S.auto=v;sv();$('s_auto').checked=v;v?micOn():(micOff(),upd())}$('micb').onclick=()=>setAuto(!an);
$('cal').onclick=()=>{if(!an){toast('මුලින් mic එක ක්‍රියාත්මක කරන්න');return}calS=[];toast('🎯 තත්පර 5ක් කඩේ සාමාන්‍ය සද්දෙට ඉන්න…');setTimeout(()=>{if(!calS||!calS.length)return;const a=calS.reduce((x,y)=>x+y,0)/calS.length;S.thr=clamp(Math.round(a*1.6+4),1,100);sv();upd();calS=null;toast('✅ Threshold '+S.thr+' ට හැදුවා')},5000)};
setInterval(()=>{if(!an)return;an.getByteTimeDomainData(buf);let s=0;for(const b of buf){const v=(b-128)/128;s+=v*v}
 lvl+=(clamp(Math.sqrt(s/buf.length)*400,0,100)-lvl)*.3;$('meter').style.transform='scaleX('+lvl/100+')';$('glow').style.transform='scale('+(.9+lvl/150)+')';$('glow').style.opacity=.2+lvl/140;if(calS)calS.push(lvl);
 if(!running||paused||busy||talk){return}
